[project]
name = "MultiRefLfD-TPGP"
version = "0.1.1"
description = "Learning Multi-Reference Frame Skills from Demonstration with Task-Parameterized Gaussian Processes (TPGP)"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Archana Kulkarni" }, { name = "Ashrith Sagar" }]
keywords = [
    "robotics",
    "imitation learning",
    "learning from demonstration",
    "task-parameterized gaussian processes",
]
requires-python = ">=3.11"
dependencies = [
    "deprecated>=1.3.1",
    "frechetdist>=0.6",
    "gpytorch>=1.14",
    "matplotlib>=3.10.9",
    "numpy>=2.0.2",
    "pyro-ppl>=1.9.1",
    "scipy>=1.17.1",
    "shapely>=2.0.7",
    "torch>=2.6.0",
    "tqdm>=4.67.3",
]

[build-system]
requires = ["hatchling>=1.29.0"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "ipykernel>=7.2.0",
    "jupyter>=1.1.1",
    "jupyter-ruff>=0.3.1",
    "jupyterlab>=4.5.7",
    "ruff>=0.15.12",
]

[project.optional-dependencies]
manim = ["manim>=0.20.1"]

[tool.hatch.build.targets.wheel]
packages = ["lfd"]

[tool.bumpversion]
current_version = "0.1.1"
parse = "(?P<major>\\d+)\\.(?P<minor>\\d+)\\.(?P<patch>\\d+)"
serialize = ["{major}.{minor}.{patch}"]
search = "{current_version}"
replace = "{new_version}"
regex = false
ignore_missing_version = false
ignore_missing_files = false
tag = false
sign_tags = false
tag_name = "v{new_version}"
tag_message = "v{new_version}"
allow_dirty = true
commit = false
message = "CHANGELOG"
moveable_tags = []
commit_args = ""
setup_hooks = []
pre_commit_hooks = []
post_commit_hooks = []
